name: Symfony CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci-symfony:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ressources/s5/noheila-ra/projets/ci-cd-symfony

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHP lint
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Audit de sécurité
        run: composer audit --format=json --no-interaction
        continue-on-error: true

      - name: Dump environment variables for production
        run: composer dump-env prod
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Install ImportMap packages
        run: php bin/console importmap:install

      - name: Compile assets
        run: php bin/console asset-map:compile

      - name: Create artifact
        run: |
          tar -czvf symfony-artifact-r1.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=var/cache \
            --exclude=var/log \
            --exclude=tests \
            --exclude=.env \
            --exclude=docker \
            --exclude=docker-compose.yml \
            --exclude=README.md \
            --exclude=*.log \
            --exclude=*.gitignore \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symfony-artifact
          path: ressources/s5/noheila-ra/projets/ci-cd-symfony/symfony-artifact-r1.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: ci-symfony
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: symfony-artifact
          path: .

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          scp -o StrictHostKeyChecking=no -P $SSH_PORT symfony-artifact-r1.tar.gz $SSH_USER@$SSH_HOST:/tmp/
          ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << 'EOF'
            sudo mv /tmp/symfony-artifact-r1.tar.gz /var/www/my-app/ressources/s5/noheila-ra/projets/ci-cd-symfony/
            cd /var/www/my-app/ressources/s5/noheila-ra/projets/ci-cd-symfony/
            sudo tar -xzvf symfony-artifact-r1.tar.gz
            sudo chown -R www-data:www-data .
            sudo chmod -R 775 public var
            php bin/console cache:clear --env=prod
            sudo systemctl restart php8.2-fpm
          EOF
          rm private_key

name: Symfony CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ressources/s5/noheila-ra/projets/ci-cd-symfony

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: ./vendor/bin/phpunit --coverage-text

      - name: Prepare prod env
        run: composer dump-env prod
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build prod dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Compile assets
        run: php bin/console asset-map:compile

      # 📦 Création d'un artefact qui contient UNIQUEMENT le projet Symfony
      - name: Create artifact
        run: |
          tar -czvf symfony-artifact-r1.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=var/cache \
            --exclude=var/log \
            --exclude=tests \
            --exclude=.env \
            --exclude=docker \
            --exclude=docker-compose.yml \
            --exclude=README.md \
            --exclude=*.log \
            --exclude=*.gitignore \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symfony-artifact
          path: ressources/s5/noheila-ra/projets/ci-cd-symfony/symfony-artifact-r1.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: symfony-artifact
          path: .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_KEY }}

      - name: Copy artifact to VPS
        run: scp -o StrictHostKeyChecking=no symfony-artifact-r1.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/app/

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/app
            rm -rf *
            tar -xvf symfony-artifact-r1.tar.gz
            rm symfony-artifact-r1.tar.gz
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console cache:clear --env=prod
            php bin/console cache:warmup --env=prod
            sudo systemctl restart apache2
          EOF
